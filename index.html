<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booktor - Biblioteca Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --vermelho: #FF0000;
            --vermelho-escuro: #CC0000;
            --preto: #000000;
            --cinza-escuro: #121212;
            --cinza-medio: #1A1A1A;
            --cinza-claro: #333333;
            --branco: #FFFFFF;
            --texto-suave: #CCCCCC;
            --sombra: rgba(0, 0, 0, 0.5);
            --gradiente: linear-gradient(135deg, var(--vermelho), var(--vermelho-escuro));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--preto);
            color: var(--branco);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .oculto { display: none !important; }

        header {
            background: var(--gradiente);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px var(--sombra);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--branco);
        }

        .logo img {
            height: 40px;
            width: auto;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .usuario-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-sair {
            background: var(--preto);
            color: var(--branco);
            border: 1px solid var(--branco);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-sair:hover {
            background: var(--cinza-claro);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .busca-container {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .input-busca {
            flex: 1;
            background: var(--cinza-medio);
            border: 1px solid var(--cinza-claro);
            color: var(--branco);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn-filtro {
            background: var(--cinza-medio);
            color: var(--branco);
            border: 1px solid var(--cinza-claro);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-filtro.ativo {
            background: var(--vermelho);
            border-color: var(--vermelho);
        }

        .grade-livros {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
        }

        .card-livro {
            background: var(--cinza-medio);
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .card-livro:hover {
            transform: translateY(-5px);
            border-color: var(--vermelho);
            box-shadow: 0 10px 20px var(--sombra);
        }

        .capa-livro {
            width: 100%;
            height: 350px;
            object-fit: cover;
            background: var(--cinza-escuro);
        }

        .info-livro {
            padding: 1.5rem;
        }

        .info-livro h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .info-livro p {
            color: var(--texto-suave);
            font-size: 0.9rem;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-conteudo {
            background: var(--cinza-medio);
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .modal-cabecalho {
            padding: 1rem;
            background: var(--cinza-escuro);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--cinza-claro);
        }

        .btn-fechar {
            background: none;
            border: none;
            color: var(--branco);
            cursor: pointer;
            font-size: 1.5rem;
        }

        .modal-corpo {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .leitor-frame {
            flex: 2;
            border: none;
            background: #eee;
        }

        .interacoes-lateral {
            flex: 1;
            background: var(--cinza-escuro);
            padding: 1.5rem;
            overflow-y: auto;
            border-left: 1px solid var(--cinza-claro);
        }

        .secao-interacao {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--cinza-claro);
        }

        .secao-interacao h4 {
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .controles-reacao {
            display: flex;
            gap: 10px;
        }

        .btn-reacao {
            flex: 1;
            background: var(--cinza-claro);
            color: var(--branco);
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-reacao.ativo-like { background: #28a745; }
        .btn-reacao.ativo-dislike { background: #dc3545; }
        .btn-reacao.ativo-salvo { background: var(--vermelho); }

        .input-nota {
            width: 100%;
            padding: 10px;
            background: var(--preto);
            border: 1px solid var(--cinza-claro);
            color: var(--branco);
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .comentarios-lista {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .comentario-item {
            background: var(--cinza-medio);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            position: relative;
        }

        .comentario-nome {
            font-weight: 600;
            color: var(--vermelho);
            display: block;
            margin-bottom: 3px;
        }

        .comentario-data {
            font-size: 0.7rem;
            color: var(--texto-suave);
            display: block;
            text-align: right;
        }

        .btn-excluir-comentario {
            position: absolute;
            top: 5px;
            right: 5px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .btn-enviar-comentario {
            width: 100%;
            padding: 10px;
            background: var(--vermelho);
            color: var(--branco);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .tela-auth {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }

        .auth-card {
            background: var(--cinza-medio);
            padding: 2.5rem;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px var(--sombra);
        }

        .auth-card h2 {
            margin-bottom: 1.5rem;
            color: var(--vermelho);
        }

        .input-auth {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            background: var(--preto);
            border: 1px solid var(--cinza-claro);
            color: var(--branco);
            border-radius: 6px;
        }

        .btn-auth {
            width: 100%;
            padding: 12px;
            background: var(--gradiente);
            color: var(--branco);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            margin-bottom: 1rem;
            transition: 0.3s;
        }

        .btn-auth:hover { opacity: 0.9; }

        .btn-google {
            background: var(--branco);
            color: var(--preto);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-anonimo {
            background: none;
            color: var(--texto-suave);
            border: 1px solid var(--cinza-claro);
        }

        .troca-auth {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--texto-suave);
            cursor: pointer;
        }

        .troca-auth span {
            color: var(--vermelho);
            text-decoration: underline;
        }

        .stat-badge {
            background: var(--preto);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: var(--texto-suave);
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">
            <img src="https://i.imgur.com/OjWFPUx.png" alt="Booktor Logo">
            <h1>Booktor</h1>
        </a>
        <div class="usuario-info oculto" id="usuarioInfo">
            <span id="nomeUsuario">Usuário</span>
            <button class="btn-sair" id="btnSair">Sair</button>
        </div>
    </header>

    <div class="container">
        <div id="telaAuth" class="tela-auth">
            <div class="auth-card">
                <div id="divLogin">
                    <h2>Entrar</h2>
                    <input type="email" id="emailLogin" class="input-auth" placeholder="Email">
                    <input type="password" id="senhaLogin" class="input-auth" placeholder="Senha">
                    <button class="btn-auth" id="btnEntrar">Entrar</button>
                    <button class="btn-auth btn-google" id="btnGoogle">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        Entrar com Google
                    </button>
                    <button class="btn-auth btn-anonimo" id="btnAnonimo">Acesso Anônimo</button>
                    <div class="troca-auth" id="irRegistro">Não tem conta? <span style="color: var(--vermelho)">Registre-se</span></div>
                </div>
                <div id="divRegistro" class="oculto">
                    <h2>Registrar</h2>
                    <input type="text" id="nomeRegistro" class="input-auth" placeholder="Nome Completo">
                    <input type="email" id="emailRegistro" class="input-auth" placeholder="Email">
                    <input type="password" id="senhaRegistro" class="input-auth" placeholder="Senha">
                    <button class="btn-auth" id="btnRegistrar">Criar Conta</button>
                    <div class="troca-auth" id="irLogin">Já tem conta? <span style="color: var(--vermelho)">Faça Login</span></div>
                </div>
            </div>
        </div>

        <div id="telaPrincipal" class="oculto">
            <div class="busca-container">
                <input type="text" id="inputBusca" class="input-busca" placeholder="Pesquisar livro ou autor...">
                <button class="btn-filtro" id="filtroSalvos">Meus Salvos</button>
            </div>

            <div class="grade-livros" id="gradeLivros"></div>
        </div>
    </div>

    <div id="modalLeitor" class="modal oculto">
        <div class="modal-conteudo">
            <div class="modal-cabecalho">
                <h2 id="modalTitulo">Título do Livro</h2>
                <button class="btn-fechar" id="btnFecharModal">&times;</button>
            </div>
            <div class="modal-corpo">
                <iframe id="frameLeitor" class="leitor-frame"></iframe>
                <div class="interacoes-lateral">
                    <div class="secao-interacao">
                        <h4>Reações</h4>
                        <div class="controles-reacao">
                            <button class="btn-reacao" id="btnLike">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-//path><path d="M18 9l-1.5-1.5a.5.5 0 0 0-.7 0l-1.5 1.5"/></svg>
                                Like <span class="stat-badge" id="countLike">0</span>
                            </button>
                            <button class="btn-reacao" id="btnDislike">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 0 0 3 3l4-9v-11H6.72a2 2 0 0 0-2 1.7l-1.38 1.3l1.5 1.5a.5.5 0 0 0 .7 0l1.5-1.5"/></svg>
                                Dislike <span class="stat-badge" id="countDislike">0</span>
                            </button>
                        </div>
                    </div>

                    <div class="secao-interacao">
                        <h4>Salvar</h4>
                        <button class="btn-reacao" id="btnSalvar" style="width: 100%">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                            <span id="textoSalvar">Salvar na Biblioteca</span>
                        </button>
                    </div>

                    <div class="secao-interacao">
                        <h4>Avaliação (0-10)</h4>
                        <input type="number" id="inputNota" class="input-nota" min="0" max="10" placeholder="Nota 0 a 10">
                        <button class="btn-enviar-comentario" id="btnEnviarNota">Avaliar</button>
                        <div style="text-align: center; margin-top: 10px; font-size: 0.9rem;">
                            Média: <span id="mediaNota">0</span> <span class="stat-badge" id="countNota">0</span>
                        </div>
                    </div>

                    <div class="secao-interacao">
                        <h4>Comentários</h4>
                        <div class="comentarios-lista" id="listaComentarios"></div>
                        <div style="margin-top: 1rem; display: flex; gap: 5px;">
                            <input type="text" id="inputComentario" class="input-nota" style="margin-bottom: 0" placeholder="Seu comentário...">
                            <button class="btn-enviar-comentario" id="btnEnviarComentario" style="width: auto">OK</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signInAnonymously, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBauGgt1pm-sBas75N40ufWRsGD6c4BsgM",
            authDomain: "sistema-de-login-blog.firebaseapp.com",
            databaseURL: "https://sistema-de-login-blog-default-rtdb.firebaseio.com",
            projectId: "sistema-de-login-blog",
            storageBucket: "sistema-de-login-blog.firebasestorage.app",
            messagingSenderId: "416120877008",
            appId: "1:416120877008:web:a5b0a26bec246d577a93d5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        let usuarioAtual = null;
        let livroAtivo = null;
        let filtroSalvos = false;

        const dom = {
            telaAuth: document.getElementById('telaAuth'),
            telaPrincipal: document.getElementById('telaPrincipal'),
            divLogin: document.getElementById('divLogin'),
            divRegistro: document.getElementById('divRegistro'),
            usuarioInfo: document.getElementById('usuarioInfo'),
            nomeUsuario: document.getElementById('nomeUsuario'),
            gradeLivros: document.getElementById('gradeLivros'),
            inputBusca: document.getElementById('inputBusca'),
            filtroSalvos: document.getElementById('filtroSalvos'),
            modalLeitor: document.getElementById('modalLeitor'),
            frameLeitor: document.getElementById('frameLeitor'),
            modalTitulo: document.getElementById('modalTitulo'),
            btnFecharModal: document.getElementById('btnFecharModal'),
            btnLike: document.getElementById('btnLike'),
            btnDislike: document.getElementById('btnDislike'),
            btnSalvar: document.getElementById('btnSalvar'),
            textoSalvar: document.getElementById('textoSalvar'),
            inputNota: document.getElementById('inputNota'),
            btnEnviarNota: document.getElementById('btnEnviarNota'),
            listaComentarios: document.getElementById('listaComentarios'),
            inputComentario: document.getElementById('inputComentario'),
            btnEnviarComentario: document.getElementById('btnEnviarComentario'),
            countLike: document.getElementById('countLike'),
            countDislike: document.getElementById('countDislike'),
            countNota: document.getElementById('countNota'),
            mediaNota: document.getElementById('mediaNota')
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                usuarioAtual = user;
                dom.telaAuth.classList.add('oculto');
                dom.telaPrincipal.classList.remove('oculto');
                dom.usuarioInfo.classList.remove('oculto');
                dom.nomeUsuario.textContent = user.displayName || user.email || 'Usuário Anônimo';
                carregarLivros();
            } else {
                usuarioAtual = null;
                dom.telaAuth.classList.remove('oculto');
                dom.telaPrincipal.classList.add('oculto');
                dom.usuarioInfo.classList.add('oculto');
            }
        });

        document.getElementById('irRegistro').onclick = () => { dom.divLogin.classList.add('oculto'); dom.divRegistro.classList.remove('oculto'); };
        document.getElementById('irLogin').onclick = () => { dom.divRegistro.classList.add('oculto'); dom.divLogin.classList.remove('oculto'); };
        document.getElementById('btnSair').onclick = () => signOut(auth);
        document.getElementById('btnAnonimo').onclick = () => signInAnonymously(auth);
        document.getElementById('btnGoogle').onclick = () => signInWithPopup(auth, provider);

        document.getElementById('btnEntrar').onclick = async () => {
            const email = document.getElementById('emailLogin').value;
            const senha = document.getElementById('senhaLogin').value;
            try { await signInWithEmailAndPassword(auth, email, senha); } catch (e) { alert("Erro ao entrar: " + e.message); }
        };

        document.getElementById('btnRegistrar').onclick = async () => {
            const nome = document.getElementById('nomeRegistro').value;
            const email = document.getElementById('emailRegistro').value;
            const senha = document.getElementById('senhaRegistro').value;
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, senha);
                await set(ref(db, `users/${cred.user.uid}`), { displayName: nome, email: email, savedBooks: {} });
            } catch (e) { alert("Erro ao registrar: " + e.message); }
        };

        function converterLinkDrive(url) {
            if (!url) return "";
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            return match ? `https://drive.google.com/file/d/${match[1]}/preview` : url;
        }

        async function carregarLivros() {
            onValue(ref(db, 'books'), (snapshot) => {
                const livros = snapshot.val();
                renderizarLivros(livros);
            });
        }

        async function renderizarLivros(livros) {
            if (!livros) { dom.gradeLivros.innerHTML = "Nenhum livro encontrado."; return; }

            const busca = dom.inputBusca.value.toLowerCase();

            // Buscamos os livros salvos do usuário uma única vez para evitar múltiplas chamadas ao Firebase dentro do filter
            let livrosSalvos = {};
            if (usuarioAtual) {
                const snapshotSalvos = await get(ref(db, `users/${usuarioAtual.uid}/savedBooks`));
                if (snapshotSalvos.exists()) {
                    livrosSalvos = snapshotSalvos.val();
                }
            }

            let lista = Object.entries(livros).filter(([id, livro]) => {
                const matchesBusca = livro.title.toLowerCase().includes(busca) || livro.author.toLowerCase().includes(busca);
                if (!matchesBusca) return false;
                if (filtroSalvos) {
                    return livrosSalvos[id];
                }
                return true;
            });

            dom.gradeLivros.innerHTML = "";
            for (const [id, livro] of lista) {
                const card = document.createElement('div');
                card.className = 'card-livro';
                card.innerHTML = `
                    <img src="${livro.coverURL}" class="capa-livro" alt="Capa">
                    <div class="info-livro">
                        <h3>${livro.title}</h3>
                        <p>${livro.author}</p>
                    </div>
                `;
                card.onclick = () => abrirLeitor(id, livro);
                dom.gradeLivros.appendChild(card);
            }
        }

        dom.inputBusca.oninput = () => carregarLivros();
        dom.filtroSalvos.onclick = () => {
            filtroSalvos = !filtroSalvos;
            dom.filtroSalvos.classList.toggle('ativo');
            carregarLivros();
        };

        function abrirLeitor(id, livro) {
            livroAtivo = id;
            dom.modalTitulo.textContent = livro.title;
            dom.frameLeitor.src = converterLinkDrive(livro.driveURL);
            dom.modalLeitor.classList.remove('oculto');
            atualizarInteracoes();
        }

        dom.btnFecharModal.onclick = () => {
            dom.modalLeitor.classList.add('oculto');
            dom.frameLeitor.src = "";
        };

        async function atualizarInteracoes() {
            if (!livroAtivo) return;

            onValue(ref(db, `interactions/likes/${livroAtivo}`), (snap) => {
                const likes = snap.val() || {};
                dom.countLike.textContent = Object.keys(likes).length;
                dom.btnLike.className = likes[usuarioAtual.uid] ? 'btn-reacao ativo-like' : 'btn-reacao';
            });

            onValue(ref(db, `interactions/dislikes/${livroAtivo}`), (snap) => {
                const dislikes = snap.val() || {};
                dom.countDislike.textContent = Object.keys(dislikes).length;
                dom.btnDislike.className = dislikes[usuarioAtual.uid] ? 'btn-reacao ativo-dislike' : 'btn-reacao';
            });

            onValue(ref(db, `interactions/ratings/${livroAtivo}`), (snap) => {
                const ratings = snap.val() || {};
                const keys = Object.keys(ratings);
                const total = keys.length;
                const soma = keys.reduce((acc, key) => acc + ratings[key], 0);
                dom.countNota.textContent = total;
                dom.mediaNota.textContent = total > 0 ? (soma / total).toFixed(1) : 0;
                dom.inputNota.value = ratings[usuarioAtual.uid] || "";
            });

            onValue(ref(db, `interactions/comments/${livroAtivo}`), (snap) => {
                const comments = snap.val() || {};
                dom.listaComentarios.innerHTML = "";
                Object.entries(comments).forEach(([id, c]) => {
                    const div = document.createElement('div');
                    div.className = 'comentario-item';
                    div.innerHTML = `
                        <span class="comentario-nome">${c.name}</span>
                        <div>${c.text}</div>
                        <span class="comentario-data">${new Date(c.timestamp).toLocaleString()}</span>
                        ${c.uid === usuarioAtual.uid ? `<button class="btn-excluir-comentario" data-id="${id}">Excluir</button>` : ''}
                    `;
                    div.querySelector('.btn-excluir-comentario')?.addEventListener('click', () => excluirComentario(id));
                    dom.listaComentarios.appendChild(div);
                });
            });

            const snapSalvos = await get(ref(db, `users/${usuarioAtual.uid}/savedBooks`));
            const salvos = snapSalvos.val() || {};
            dom.btnSalvar.className = salvos[livroAtivo] ? 'btn-reacao ativo-salvo' : 'btn-reacao';
            dom.textoSalvar.textContent = salvos[livroAtivo] ? 'Remover dos Salvos' : 'Salvar na Biblioteca';
        }

        dom.btnLike.onclick = async () => {
            const refLike = ref(db, `interactions/likes/${livroAtivo}/${usuarioAtual.uid}`);
            const refDislike = ref(db, `interactions/dislikes/${livroAtivo}/${usuarioAtual.uid}`);
            const existe = (await get(refLike)).exists();
            if (existe) { await remove(refLike); }
            else { await set(refLike, true); await remove(refDislike); }
        };

        dom.btnDislike.onclick = async () => {
            const refLike = ref(db, `interactions/likes/${livroAtivo}/${usuarioAtual.uid}`);
            const refDislike = ref(db, `interactions/dislikes/${livroAtivo}/${usuarioAtual.uid}`);
            const existe = (await get(refDislike)).exists();
            if (existe) { await remove(refDislike); }
            else { await set(refDislike, true); await remove(refLike); }
        };

        dom.btnSalvar.onclick = async () => {
            const refSalvo = ref(db, `users/${usuarioAtual.uid}/savedBooks/${livroAtivo}`);
            const existe = (await get(refSalvo)).exists();
            if (existe) { await remove(refSalvo); } else { await set(refSalvo, true); }
            atualizarInteracoes();
        };

        dom.btnEnviarNota.onclick = async () => {
            const nota = parseInt(dom.inputNota.value);
            if (isNaN(nota) || nota < 0 || nota > 10) { alert("Nota deve ser de 0 a 10"); return; }
            await set(ref(db, `interactions/ratings/${livroAtivo}/${usuarioAtual.uid}`), nota);
            alert("Nota enviada!");
        };

        dom.btnEnviarComentario.onclick = async () => {
            const texto = dom.inputComentario.value.trim();
            if (!texto) return;
            const novoComentario = {
                uid: usuarioAtual.uid,
                name: usuarioAtual.displayName || 'Anônimo',
                text: texto,
                timestamp: Date.now()
            };
            await push(ref(db, `interactions/comments/${livroAtivo}`), novoComentario);
            dom.inputComentario.value = "";
        };

        async function excluirComentario(id) {
            if (confirm("Excluir comentário?")) {
                await remove(ref(db, `interactions/comments/${livroAtivo}/${id}`));
            }
        }

    </script>
</body>
</html>
